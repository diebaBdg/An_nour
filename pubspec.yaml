name: an_nour
description: "Application islamique An-Nour - prières, Coran, douas et plus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_flutter: ^1.1.0
  dio: ^5.8.0+1
  adhan: ^2.0.0+1
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  hijri: ^3.0.0
  share_plus: ^10.1.4
  just_audio: ^0.9.43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/duas.json
    - assets/data/hadiths.json
    - assets/data/quotes.json
    - assets/data/seerah.json
    - assets/data/names_of_allah.json

flutter_launcher_icons:
  image_path: "lib/assets/icon/an_nour_logo.png"
  android: true
  ios: true
  adaptive_icon_background: "#0A3222"
  adaptive_icon_foreground: "lib/assets/icon/an_nour_logo_foreground.png"
  min_sdk_android: 21